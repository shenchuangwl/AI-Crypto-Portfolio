openapi: 3.0.3
info:
  title: OnlyCoin Y facts and observer supply API
  version: 1.0.0
  description: |
    Designed integration contract; not evidence of deployment or backfill.
    UTC daily post-TopK facts are separate from the old occupancy ledger.
    Supply control enables eligibility delivery to a local observer, never trading.
    Response extensions are allowed; the public control request is strict.
servers:
  - url: /
    description: Same-origin gateway; paths already include /api/v1.
security: []
paths:
  /api/v1/screener-y/dmr-daily:
    get:
      operationId: getOnlyCoinYDaily
      summary: Read the Y daily unique selected-symbol projection
      parameters:
        - $ref: '#/components/parameters/BusinessDate'
        - $ref: '#/components/parameters/AsOf'
      responses:
        '200':
          $ref: '#/components/responses/Daily'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/review/onlycoin:
    get:
      operationId: getOnlyCoinReview
      summary: Read the OnlyCoin review projection, not occupancy episodes
      parameters:
        - name: board
          in: query
          required: true
          schema:
            type: string
            enum: [y]
          description: Only the Y board is supported by this contract.
        - $ref: '#/components/parameters/BusinessDate'
        - $ref: '#/components/parameters/AsOf'
      responses:
        '200':
          $ref: '#/components/responses/Daily'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/review/onlycoin/stats:
    get:
      operationId: getOnlyCoinReviewStats
      summary: Unique-coin DMR statistics for the OnlyCoin replay, closed at the business-day node
      description: |
        Membership comes only from the OnlyCoin dataset (the same projection as
        /api/v1/review/onlycoin); prices come only from board snapshot prints.
        The occupancy ledger is never read, so these are not its trade results.
        Exit is the last 15m node before the 00:00 UTC day boundary (-095 / 23:45Z),
        not the moment the symbol actually left the pool. A business day that has
        not ended yields status OPEN rows with null PnL, never a complete-day figure.
        Disabled deployments answer 404 ONLYCOIN_STATS_DISABLED; this is not an error.
      parameters:
        - name: board
          in: query
          required: true
          schema:
            type: string
            enum: [y]
        - $ref: '#/components/parameters/BusinessDate'
        - $ref: '#/components/parameters/AsOf'
        - name: from
          in: query
          required: false
          description: Custom range start (UTC). Must be sent together with `to`.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          description: Custom range end, exclusive (UTC). Must be sent together with `from`.
          schema:
            type: string
            format: date-time
        - name: compare
          in: query
          required: false
          description: |
            Up to 3 independent comparison ranges as `<fromISO>~<toISO>`; repeat the
            parameter per range. Each range performs its own first-entry and
            unique-coin deduplication, and returns a summary only.
          schema:
            type: array
            maxItems: 3
            items:
              type: string
      responses:
        '200':
          description: Unique-coin statistics for the main range plus comparison summaries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnlyCoinStats'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          description: Statistics disabled by the deployment flag ONLYCOIN_STATS
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/onlycoin/sources/screener-y/status:
    get:
      operationId: getOnlyCoinYSourceStatus
      summary: Read desired supply state and observer-only connectivity
      description: |
        Never interpret enabled or observer connectivity as strategy connectivity.
        A first status read may initialize control storage in the implementation.
      responses:
        '200':
          description: Source control and connectivity status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceStatus'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/onlycoin/sources/screener-y/control:
    put:
      operationId: putOnlyCoinYSourceControl
      summary: Change desired observer supply state using revision CAS
      description: |
        Authenticate against server-side ONLYCOIN_ADMIN_TOKEN. Missing server
        configuration fails closed. Unsafe cross-origin writes must be rejected.
        Read status for expected_revision; retry an ambiguous result with the
        exact same request_id and body. Reusing an ID with changed content or
        submitting a stale revision conflicts. Read status after success.
        Each accepted new operation advances revision and generation; generation
        must not roll back during recovery. Current-day snapshot supply only.
        This operation does not change Y execution permissions or start a strategy.
      security:
        - OnlyCoinAdmin: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ControlRequest'
      responses:
        '200':
          description: Accepted desired control state, or original idempotent result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlResult'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          description: Missing or invalid bearer credential
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Unsafe origin or forbidden write
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Revision CAS conflict or request ID reused with different content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  securitySchemes:
    OnlyCoinAdmin:
      type: http
      scheme: bearer
      description: Server-side ONLYCOIN_ADMIN_TOKEN; never embed in a frontend bundle.
  parameters:
    BusinessDate:
      name: business_date
      in: query
      required: false
      description: UTC calendar date, defaulting to the current UTC day.
      schema:
        type: string
        format: date
        pattern: '^\d{4}-\d{2}-\d{2}$'
    AsOf:
      name: as_of
      in: query
      required: false
      description: |
        Timezone-aware ISO-8601 availability cutoff, defaulting to server time.
        Archive availability is a proxy, not evidence of actual publication.
      schema:
        type: string
        format: date-time
  responses:
    Daily:
      description: |
        Daily projection with explicit stale and coverage metadata. An empty or
        partial result is not evidence of complete history. No trading permission.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DailyProjection'
    InvalidRequest:
      description: Invalid query, board, timestamp, body type or unknown control field
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: Required storage/service unavailable or admin control not configured
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    OnlyCoinStats:
      type: object
      additionalProperties: true
      required: [schema, board_key, business_date, as_of, main, compare]
      properties:
        schema:
          type: string
          enum: [onlycoin-stats-v1]
        board_key:
          type: string
          enum: [y]
        parameter_version:
          type: string
        business_date:
          type: string
          format: date
        as_of:
          type: string
          format: date-time
        server_time:
          type: string
          format: date-time
        dataset_id:
          type: string
          enum: [live, archive]
        snapshot_reads:
          type: integer
        node_grid:
          type: object
          additionalProperties: true
          description: 96 nodes of 15 minutes; last_node_seq 95 is the day close used as exit.
        pnl_basis:
          type: object
          additionalProperties: true
          description: |
            Declares the calculation basis. pnl_pct is the direction-aware realized
            percentage from the shared review PnL function; the project's 盈亏数值
            column is the sign 1/0/-1; position, quantity, principal, leverage, fees
            and funding are all excluded because no such input exists in this data.
        main:
          $ref: '#/components/schemas/OnlyCoinStatRange'
        compare:
          type: array
          items:
            $ref: '#/components/schemas/OnlyCoinStatRange'
    OnlyCoinStatRange:
      type: object
      additionalProperties: true
      required: [id, label, from, to, cutoff]
      description: |
        One independent statistics range. `rows` is present for the main range only.
        `cutoff` is the causal availability bound: only commits with
        available_at <= cutoff are projected.
      properties:
        id:
          type: string
        label:
          type: string
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        cutoff:
          type: string
          format: date-time
        span_days:
          type: number
        unique_symbols:
          type: integer
        incomplete_days:
          type: array
          items:
            type: string
            format: date
        days_with_commits:
          type: array
          items:
            type: string
            format: date
        error:
          type: string
        summary:
          type: object
          additionalProperties: true
          description: Same shape as the review summary; produced by the shared summarize function.
        rows:
          type: array
          items:
            $ref: '#/components/schemas/OnlyCoinStatRow'
    OnlyCoinStatRow:
      type: object
      additionalProperties: true
      required: [coin_id, symbol, pool, direction, status, enter_time_utc]
      description: |
        One unique coin, counted once per range at its first DMR entry.
        Missing prices stay null and are flagged; they are never zero-filled.
      properties:
        coin_id:
          type: string
          description: canonical_asset_id, else underlying_asset, else symbol; upper case.
        symbol:
          type: string
        canonical_asset_id:
          type: string
          nullable: true
        pool:
          type: string
          enum: [LONG, SHORT]
        direction:
          type: string
          enum: [up, down]
        zone:
          type: string
          enum: [DMR]
        status:
          type: string
          enum: [CLOSED, OPEN]
          description: OPEN means the first-entry business day has not ended; never in any PnL figure.
        business_date:
          type: string
          format: date
        day_complete:
          type: boolean
        enter_scan_id:
          type: string
        enter_time_utc:
          type: string
          format: date-time
        enter_price:
          type: number
          nullable: true
        enter_price_source:
          type: string
          nullable: true
        exit_scan_id:
          type: string
          nullable: true
        exit_time_utc:
          type: string
          format: date-time
          nullable: true
        exit_price:
          type: number
          nullable: true
        exit_price_source:
          type: string
          nullable: true
        dwell_minutes:
          type: number
          nullable: true
        dwell_nodes:
          type: integer
          nullable: true
        pnl_pct:
          type: number
          nullable: true
        pnl_sign:
          type: integer
          nullable: true
          enum: [1, 0, -1, null]
        repeat_entries:
          type: integer
          description: Later re-entries of the same unique coin inside the range; not counted again.
        flags:
          type: array
          items:
            type: string
          description: INCOMPLETE_DAY / MISSING_ENTRY_PRICE / MISSING_EXIT_PRICE / EXIT_PRICE_PREV_NODE
    Error:
      type: object
      additionalProperties: true
      description: Error details are extensible; no exact error envelope is asserted.
    Member:
      type: object
      additionalProperties: true
      required: [symbol]
      properties:
        symbol:
          type: string
          minLength: 1
          description: Original contract identifier; do not normalize or silently repair.
        member_id:
          type: string
        first_scan_id:
          type: string
        first_selected_at:
          type: string
          format: date-time
        first_available_at:
          type: string
          format: date-time
        first_direction:
          type: string
          enum: [LONG, SHORT]
        directions:
          type: array
          items:
            type: string
            enum: [LONG, SHORT]
        provenance:
          type: string
          enum: [live_committed, observed_archive, counterfactual_replay]
        availability_quality:
          type: string
          description: COMMITTED or archive PROXY; extensible metadata.
    DailyProjection:
      type: object
      additionalProperties: true
      required:
        - board_key
        - business_date
        - cycle_start_utc
        - cycle_end_utc
        - projection_revision
        - long
        - short
        - onlycoin
        - counts
        - coverage
        - stale
        - dmr_executable
        - consumable_by_dmr
      properties:
        board_key:
          type: string
          enum: [y]
        business_date:
          type: string
          format: date
        cycle_start_utc:
          type: string
          format: date-time
        cycle_end_utc:
          type: string
          format: date-time
        server_time:
          type: string
          format: date-time
        projection_revision:
          type: integer
          minimum: 0
        as_of_scan_id:
          type: string
          nullable: true
        last_committed_at:
          type: string
          format: date-time
          nullable: true
        long:
          type: array
          items:
            $ref: '#/components/schemas/Member'
        short:
          type: array
          items:
            $ref: '#/components/schemas/Member'
        onlycoin:
          type: array
          description: Full daily set deduplicated by symbol across directions, not a viewport.
          items:
            $ref: '#/components/schemas/Member'
        counts:
          type: object
          additionalProperties: true
          required: [long, short, onlycoin]
          properties:
            long:
              type: integer
              minimum: 0
            short:
              type: integer
              minimum: 0
            onlycoin:
              type: integer
              minimum: 0
        coverage:
          type: object
          additionalProperties: true
          description: Missing scans, availability quality and identity flags must remain visible.
        stale:
          type: boolean
        dmr_executable:
          type: boolean
          enum: [false]
        consumable_by_dmr:
          type: boolean
          enum: [false]
    ControlRequest:
      type: object
      additionalProperties: false
      required: [enabled, expected_revision, request_id, reason]
      properties:
        enabled:
          type: boolean
          description: Strict JSON boolean; strings and integers are invalid.
        expected_revision:
          type: integer
          minimum: 0
          description: Revision read from status; JSON booleans are invalid.
        request_id:
          type: string
          minLength: 1
          pattern: '\S'
        reason:
          type: string
          description: Operator audit reason, without credentials or secrets.
    ControlResult:
      type: object
      additionalProperties: true
      required: [enabled, revision, generation]
      properties:
        enabled:
          type: boolean
        revision:
          type: integer
          minimum: 0
        generation:
          type: integer
          minimum: 0
          description: Durable monotonic delivery fence; must never roll back.
        replay_policy:
          type: string
          enum: [current_day_snapshot]
    SourceStatus:
      allOf:
        - $ref: '#/components/schemas/ControlResult'
        - type: object
          additionalProperties: true
          required: [consumer_connected, consumer_kind, trading_connected, dmr_executable, effective_state]
          properties:
            consumer_connected:
              type: boolean
              description: Observer connectivity only; not proof of strategy delivery.
            consumer_kind:
              type: string
              enum: [local_observer]
            trading_connected:
              type: boolean
              enum: [false]
            dmr_executable:
              type: boolean
              enum: [false]
            effective_state:
              type: string
              description: Supply state label; no exhaustive state enum asserted.
